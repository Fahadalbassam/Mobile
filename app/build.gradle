plugins {
    id 'com.android.application'
}

android {
    namespace 'com.group5.studentplanner'
    compileSdk 36

    defaultConfig {
        applicationId "com.group5.studentplanner"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Unit tests for the Today dashboard logic (run on the computer, no phone needed)
    testImplementation 'junit:junit:4.13.2'
}
